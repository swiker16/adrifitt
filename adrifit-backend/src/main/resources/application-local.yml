# Local profile: runs without PostgreSQL using an H2 file database.
#   mvnw spring-boot:run -Dspring-boot.run.profiles=local
spring:
  datasource:
    url: ${DB_URL:jdbc:h2:file:./data/adrifit;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;AUTO_SERVER=TRUE}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
    driver-class-name: org.h2.Driver

adrifit:
  seed:
    demo-data: ${SEED_DEMO_DATA:true}
