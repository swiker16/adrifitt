spring:
  application:
    name: adrifit-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/adrifit}
    username: ${DB_USERNAME:adrifit}
    password: ${DB_PASSWORD:adrifit}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
    show-sql: false
  servlet:
    multipart:
      max-file-size: 15MB
      max-request-size: 16MB

server:
  port: ${SERVER_PORT:8080}

adrifit:
  storage:
    local:
      base-dir: ${STORAGE_BASE_DIR:uploads}
  security:
    jwt:
      # Base64-encoded 256-bit secret. Override in production via env var.
      secret: ${JWT_SECRET:c2VjcmV0LWtleS1hZHJpZml0LWNoYW5nZS1tZS1pbi1wcm9kdWN0aW9uLTEyMzQ1Ng==}
      expiration-ms: ${JWT_EXPIRATION_MS:86400000}
