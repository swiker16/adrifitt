<!doctype html>

  <meta charset="utf-8">
  <title>AdriFitt — Entrenamiento personal. Resultados reales.</title>
  <base href="/">
  <script>
    // Apply the saved theme before the app loads (no white flash in dark mode). See ThemeService.
    (function () {
      var mode = 'system';
      try { mode = localStorage.getItem('adrifit_theme') || 'system'; } catch (e) {}
      var dark = mode === 'dark' || (mode === 'system' && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
    })();
    // Keep the browser's install prompt (Android/desktop Chrome, Edge) for our own "Descargar la app" button.
    window.addEventListener('beforeinstallprompt', function (e) { e.preventDefault(); window.__installPrompt = e; });
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
